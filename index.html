  <div class="sr-only" id="liveStatus" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript>
    <p class="noscript">请开启 JavaScript，才能敲响这只木鱼。</p>
  </noscript>

  <dialog id="authDialog" class="account-dialog" aria-labelledby="authTitle">
    <button type="button" class="dialog-close" data-close aria-label="关闭">×</button>
    <p class="account-eyebrow">无事 · 有你</p>
    <h2 id="authTitle">欢迎回来</h2>
    <p id="authDescription" class="account-note">登录后，每一次轻敲都有记录。</p>
    <form id="authForm">
      <label id="usernameField">用户名<input id="username" name="username" minlength="2" maxlength="254" autocomplete="username" required autocapitalize="none" spellcheck="false" placeholder="请输入用户名"></label>
      <label>密码<input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required placeholder="至少 8 位"></label>
      <p id="authMessage" class="account-message" role="status"></p>
      <button type="submit" id="authSubmit" class="account-primary">登录</button>
    </form>
    <button type="button" id="switchAuth" class="account-switch">还没有账户？去注册</button>
  </dialog>
  <dialog id="profileDialog" class="account-dialog profile-dialog" aria-labelledby="profileTitle">
    <button type="button" class="dialog-close" data-close aria-label="关闭">×</button>
    <p class="account-eyebrow">我的 · 无事簿</p>
    <h2 id="profileTitle">用户信息</h2>
    <p class="account-note">一敲一放，记录属于你的无事时光。</p>
    <div class="tap-total"><span>累计敲击</span><strong id="totalTaps">—</strong><span>次 · 一敲一放，慢慢积累</span></div>
    <dl class="profile-details"><div><dt>注册时间</dt><dd id="joinedAt">—</dd></div><div><dt>最近敲击</dt><dd id="lastTapAt">尚未敲击</dd></div></dl>
    <p id="syncMessage" class="account-message" role="status"></p>
    <button type="button" id="retrySync" class="account-switch" hidden>重新同步</button>
    <button type="button" id="logoutButton" class="account-secondary">退出登录</button>
  </dialog>
  <p id="accountNotice" class="account-notice" role="status" hidden></p>
